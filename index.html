<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSP Agent Report</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .card .number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
            color: #1f4e78;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filters input,
        .filters select {
            padding: 12px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .table-box {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f4e78;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f5f8fb;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-inactive {
            color: red;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>RSP Agent Report</h1>
    <p>Received • Send • Pay Agent Dashboard</p>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Total Agents</h3>
            <div class="number" id="totalAgents">0</div>
        </div>

        <div class="card">
            <h3>Total Received</h3>
            <div class="number" id="totalReceived">0</div>
        </div>

        <div class="card">
            <h3>Total Send</h3>
            <div class="number" id="totalSend">0</div>
        </div>

        <div class="card">
            <h3>Total Pay</h3>
            <div class="number" id="totalPay">0</div>
        </div>
    </div>

    <div class="filters">

        <input
            type="text"
            id="search"
            placeholder="Search agent..."
            onkeyup="filterData()"
        >

        <select id="teamLeader" onchange="filterData()">
            <option value="">All Team Leaders</option>
            <option value="RKLAPOKE">RKLAPOKE</option>
            <option value="CITY">CITY</option>
            <option value="TRUST">TRUST</option>
            <option value="ARBAB">ARBAB</option>
            <option value="MIRAZ">MIRAZ</option>
            <option value="RANA">RANA</option>
            <option value="SUPERMAN">SUPERMAN</option>
            <option value="ROSE">ROSE</option>
            <option value="TONY">TONY</option>
            <option value="ROLEX">ROLEX</option>
            <option value="CHERY">CHERY</option>  
        </select>

        <select id="status" onchange="filterData()">
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

    </div>

    <div class="table-box">

        <table>
            <thead>
                <tr>
                 <th>AGENT</th>
                 <th>AMOUNT</th>
                 <th>GROUP</th>
                </tr>
            </thead>

            <tbody id="agentTable">
            </tbody>

        </table>

    </div>

</div>
<div class="table-box">

    <h2>SDP</h2>
    <div id="sdpTotal">
    Total SDP Amount: 0
</div>
    
    <div id="sdpGroupSummary">
</div>

    <table>
        <thead>
            <tr>
                <th>AGENT</th>
                <th>AMOUNT</th>
                <th>GROUP</th>
            </tr>
        </thead>

        <tbody id="sdpTable">
        </tbody>
    </table>

</div>
<script>

const agents = [];


const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXS0TJLpUj6cxaFcqM9HS1xPPdLDhOHz2XJ4H6S_S4VeouiBvfF7q12Pxb5zuOqRP8AvYuN7syAEOt/pubhtml";

const SDP_GID = "141459645";

const SDP_CSV_URL = SHEET_URL.replace("/pubhtml", "/pub?gid=" + SDP_GID + "&output=csv");

fetch(SDP_CSV_URL)
    .then(response => response.text())
    .then(csv => {
        console.log("SDP data loaded:", csv);
        displaySDP(csv);
    })
    .catch(error => {
        console.error("SDP loading error:", error);
    });

function displaySDP(csv) {
    const rows = csv.trim().split("\n");
    const table = document.getElementById("sdpTable");

    table.innerHTML = "";
    let totalAmount = 0;
    const groupTotals = {};
    
    rows.slice(1).forEach(row => {
        const columns = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];

        if (columns.length < 3) {
            console.log("Skipping SDP row:", row);
            return;
        }
        

const tr = document.createElement("tr");

const agent = columns[0] ? columns[0].replace(/^"|"$/g, "").trim() : "";
const amount = columns[1] ? columns[1].replace(/^"|"$/g, "").trim() : "";

const numericAmount = parseFloat(amount.replace(/,/g, "")) || 0;
totalAmount += numericAmount;

const group = columns[2] ? columns[2].replace(/^"|"$/g, "").trim() : "";

        if (!groupTotals[group]) {
    groupTotals[group] = numericAmount;
}

groupTotals[group] += numericAmount;

tr.innerHTML = `
    <td>${agent}</td>
    <td>${amount}</td>
    <td>${group}</td>
`;
        table.appendChild(tr);
    });

    console.log("SDP TOTAL:", totalAmount);
    console.log("SDP BOX:", document.getElementById("sdpTotal"));

document.getElementById("sdpTotal").textContent =
    "Total SDP Amount: ৳" +
    totalAmount.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

    const summary = document.getElementById("sdpGroupSummary");

summary.innerHTML = "<h3>Amount by Group</h3>";

Object.entries(groupTotals).forEach(([group, amount]) => {
    summary.innerHTML += `
        <div>
            <strong>${group}</strong>:
            ৳${amount.toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            })}
        </div>
    `;
});
    }
    
    function displayData(data) {

    const table = document.getElementById("agentTable");

    table.innerHTML = "";

    data.forEach(agent => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${agent.name}</td>
            <td>${agent.leader}</td>
            <td>${agent.shop}</td>
            <td>${agent.received}</td>
            <td>${agent.send}</td>
            <td>${agent.pay}</td>
            <td class="${agent.status === 'Active'
                ? 'status-active'
                : 'status-inactive'}">
                ${agent.status}
            </td>
        `;

        table.appendChild(row);

    });

    updateTotals(data);
}


function updateTotals(data) {

    document.getElementById("totalAgents").textContent =
        data.length;

    document.getElementById("totalReceived").textContent =
        data.reduce((sum, agent) => sum + agent.received, 0);

    document.getElementById("totalSend").textContent =
        data.reduce((sum, agent) => sum + agent.send, 0);

    document.getElementById("totalPay").textContent =
        data.reduce((sum, agent) => sum + agent.pay, 0);
}


function filterData() {

    const search =
        document.getElementById("search").value.toLowerCase();

    const leader =
        document.getElementById("teamLeader").value;

    const status =
        document.getElementById("status").value;

    const filtered = agents.filter(agent => {

        return (

            agent.name.toLowerCase().includes(search)

            &&

            (leader === "" || agent.leader === leader)

            &&

            (status === "" || agent.status === status)

        );

    });

    displayData(filtered);
}


displayData(agents);

</script>

</body>
</html>
